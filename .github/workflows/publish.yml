name: Publish Release

on:
  release:
    types: [published]
  # Manual runs verify Chrome access without uploading or publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run check
      - name: Start silent audio device for Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=skipmute_ci
          echo "PULSE_SINK=skipmute_ci" >> "$GITHUB_ENV"
      - run: npm run test:browser
      - run: npm run package:firefox
      - run: npm run package:chrome
      - run: python3 -m zipfile -t dist/twitch-vod-muted-skipper-firefox.zip
      - run: python3 -m zipfile -t dist/twitch-vod-muted-skipper-chrome.zip
      - run: npx --yes web-ext@10.6.0 lint --source-dir dist/firefox --warnings-as-errors
      - name: Attach browser packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/twitch-vod-muted-skipper-{firefox,chrome}.zip --clobber

  chrome:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID || secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: joigloedgnkomhlekekfopbbeanlkcnp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Check keyless authentication configuration
        env:
          PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          if { test -n "$PROVIDER" && test -z "$SERVICE_ACCOUNT"; } || { test -z "$PROVIDER" && test -n "$SERVICE_ACCOUNT"; }; then
            echo "Set both CWS_WORKLOAD_IDENTITY_PROVIDER and CWS_SERVICE_ACCOUNT repository variables"
            exit 1
          fi
      - name: Authenticate to Google without a JSON key
        if: vars.CWS_WORKLOAD_IDENTITY_PROVIDER != ''
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Download verified Chrome release package
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "twitch-vod-muted-skipper-chrome.zip" --dir dist
      - name: Verify Chrome access or submit release
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          # Existing key-based setups remain supported during migration.
          CWS_SERVICE_ACCOUNT_JSON: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER == '' && secrets.CWS_SERVICE_ACCOUNT_JSON || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if test "$EVENT_NAME" = "workflow_dispatch"; then
            node scripts/publish-chrome.mjs --check
          else
            node scripts/publish-chrome.mjs
          fi

  firefox:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download verified Firefox release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "twitch-vod-muted-skipper-firefox.zip" --dir dist
      - name: Submit Firefox update to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY" || { echo "Missing AMO_JWT_ISSUER repository secret"; exit 1; }
          test -n "$WEB_EXT_API_SECRET" || { echo "Missing AMO_JWT_SECRET repository secret"; exit 1; }
          python3 -m zipfile -e dist/twitch-vod-muted-skipper-firefox.zip dist/firefox
          npx --yes web-ext@10.6.0 sign --source-dir dist/firefox --channel listed --approval-timeout 0
